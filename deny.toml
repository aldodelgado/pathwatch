# Licence and advisory policy for `cargo deny`. Not yet run locally (cargo-deny
# is not installed here); the allow-list reflects the licences recorded in
# planning/02-architecture.md §3.1 and may need additions on first run.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
