# Licence and advisory policy for `cargo deny`, run by the `licences` job in
# .github/workflows/ci.yml. The allow-list is the set of licences the
# dependency tree uses; a new dependency under another licence fails the job
# until its licence is reviewed and added here.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
