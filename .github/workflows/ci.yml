# Not yet exercised: this workspace is not a git repository and has no remote.
# The same commands were run locally on macOS (arm64) and in a Linux container.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # What this runner permits. On Ubuntu runners unprivileged ICMP is usually
      # off; the loopback ICMP test then verifies the "unsupported" path instead.
      - run: cargo run --locked -p pathwatch -- doctor
      # One Crossterm major only, once the dashboard crate exists (milestone 2).
      - run: cargo tree -d --locked || true

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories
