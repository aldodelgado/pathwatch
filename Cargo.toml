[workspace]
resolver = "3"
members = ["crates/pathwatch-core", "crates/pathwatch-tui", "crates/pathwatch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1.54", features = ["rt", "time", "net", "sync", "macros", "io-util", "signal"] }
tokio-util = "0.7"
socket2 = { version = "0.6.5", features = ["all"] }
libc = "0.2"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-platform-verifier = "0.7"
hyper = { version = "1.12", features = ["client", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1.2"
thiserror = "2"
jiff = "1"
getrandom = "0.3"
etcetera = "0.11"
clap = { version = "4.6", features = ["derive"] }
rcgen = "0.14"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
